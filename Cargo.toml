[workspace]
resolver = "2"
members = [
    "shared/core",
    "shared/automation",
    "template/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
opener = "0.7"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
