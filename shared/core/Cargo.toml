[package]
name = "appkit-core"
version.workspace = true
edition.workspace = true

[build-dependencies]
serde_json = "1"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
dirs.workspace = true
reqwest.workspace = true
base64.workspace = true
aes-gcm.workspace = true
sha2.workspace = true
rand.workspace = true
opener.workspace = true
winreg.workspace = true
tauri = { version = "2", optional = true }
# SQLite 数据库表管理（仅 cmd-db 启用时编译，项目按需启用）
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# profile 头像缩略图（png/jpeg 大图压缩为 64x64，避免列表渲染大 base64 拖慢前端）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[features]
default = []
bridge = ["dep:tauri"]
# 命令组（未启用的命令不参与编译）
cmd-browser = ["bridge"]
cmd-files = ["bridge"]
cmd-utils = ["bridge"]
cmd-db = ["bridge", "dep:rusqlite"]
# 预设组合（项目直接选用，避免逐个配置出错）
#   cmd-full：浏览器 + 文件 + 工具（多数业务项目）
#   cmd-lite：仅文件 + 工具（005/900 等纯数据类项目）
# 若还需数据库表管理，额外追加 cmd-db
cmd-full = ["cmd-browser", "cmd-files", "cmd-utils"]
cmd-lite = ["cmd-files", "cmd-utils"]
